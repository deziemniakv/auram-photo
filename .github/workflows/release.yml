name: Release

# Builds the Windows package for a version tag and attaches it, together with
# the auram-release.json manifest Auram Launcher reads, to a draft GitHub
# release. A maintainer reviews and publishes the draft manually.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Verify tag matches the application version
        shell: bash
        run: |
          version=$(node -p "require('./apps/photo/package.json').version")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match apps/photo/package.json version ${version}" >&2
            exit 1
          fi

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - name: Build package and release manifest
        run: pnpm --filter @auram/photo package:win

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./apps/photo/package.json').version")
          dir="apps/photo/release/${version}"
          prerelease=""
          if [[ "${version}" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "v${version}" --draft ${prerelease} --title "Auram Photo ${version}" \
            --notes "See CHANGELOG.md." \
            "${dir}"/auram-photo-"${version}"-win32-x64.zip "${dir}/auram-release.json"
